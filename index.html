<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIACOMO DONATI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FAF9F6;
      color: #111;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
    }

    /* INTESTAZIONE E CONTATTI */
    header {
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
      display: inline-block;
      margin-bottom: 25px;
    }

    .nome-home {
      text-decoration: none;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    .nome-home:hover {
      opacity: 0.65;
    }

    .contatti a, .colonna-testo a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }

    .contatti a:hover, .colonna-testo a:hover {
      text-decoration-style: dotted;
      color: #555;
    }

    /* MENU DI NAVIGAZIONE TRA LE PAGINE */
    nav {
      margin-bottom: 60px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-size: 13px;
      padding-bottom: 3px;
      border-bottom: 1px solid transparent;
      cursor: pointer;
    }

    nav a:hover, nav a.attivo {
      border-bottom: 1px solid #000;
      font-weight: 700;
    }

    /* GESTIONE DELLE PAGINE */
    .pagina {
      display: none;
    }

    .pagina.visibile {
      display: block;
    }

    /* --- PAGINA HOME: CITAZIONE + STATEMENT + MEGAFONI --- */
    #home {
      position: relative;
    }

    .spazio-citazione {
      position: relative;
      z-index: 2;
      min-height: 40vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 15px;
      margin-bottom: 60px;
    }

    .citazione-testo {
      font-size: 18px;
      font-style: italic;
      max-width: 620px;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .citazione-autore {
      font-size: 12px;
      border-bottom: 1px solid #000;
      padding-bottom: 3px;
    }

    .statement-wrapper {
      position: relative;
      z-index: 2;
      max-width: 680px;
      margin: 0 auto 40px auto;
      padding: 40px 20px;
    }

    .statement-testo {
      position: relative;
      z-index: 2;
      font-size: 15px;
      line-height: 1.8;
    }

    .sfondo-home {
      position: absolute;
      z-index: 1;
      opacity: 0.55;
      mix-blend-mode: multiply;
      pointer-events: none;
      height: auto;
    }

    .megafono-1 {
      top: -1%;
      left: 1%;
      width: 490px;
      transform: rotate(-7deg);
    }

    .megafono-2 {
      top: 40px;
      right: 8%;
      width: 250px;
      transform: rotate(6deg);
    }

    .megafono-3 {
      top: 58%;
      left: 11%;
      width: 240px;
      transform: rotate(4deg);
    }

    .megafono-inline {
      position: relative;
      z-index: 2;
      display: block;
      max-width: 100%;
      height: auto;
      opacity: 0.55;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .megafono-4 {
      width: 470px;
      margin: 0 auto 120px auto;
    }

    /* --- SEZIONE PROGETTI --- */
    .progetto-sezione {
      max-width: 1120px;
      margin: 0 auto 150px auto;
      padding-bottom: 80px;
      border-bottom: 1px solid #000;
    }

    .progetto-sezione:last-child {
      border-bottom: none;
      margin-bottom: 60px;
    }

    .progetto-header-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 48px;
      align-items: start;
      margin-bottom: 48px;
    }

    .progetto-header-grid.confessioni-top {
      grid-template-columns: 0.78fr 1.22fr;
    }

    .progetto-header-grid.asportissima-top {
      grid-template-columns: 1.15fr 0.85fr;
    }

    .scheda-info {
      max-width: 480px;
    }

    .progetto-titolo {
      font-size: 19px;
      font-weight: 700;
      margin: 0 0 6px 0;
    }

    .progetto-meta {
      font-size: 12px;
      line-height: 1.5;
      padding-bottom: 6px;
      margin-bottom: 18px;
      border-bottom: 1px solid #000;
      display: inline-block;
    }

    .descrizione-opera {
      font-size: 13.5px;
      line-height: 1.75;
      margin: 0;
      color: #111;
    }

    .nota {
      font-size: 11.5px;
      margin-top: 10px;
      padding-bottom: 3px;
      border-bottom: 1px solid #000;
      display: inline-block;
    }

    .crediti-foto {
      font-size: 11.5px;
      line-height: 1.55;
      color: #111;
      margin-top: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid #000;
      display: inline-block;
    }

    img.opera, video.opera {
      width: 100%;
      height: auto;
      display: block;
    }

    img.disegno-tecnico {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
    }

    /* 01. Sender-Receiver (Video) */
    .sr-video-doc-grid {
      display: grid;
      grid-template-columns: 0.63fr 1.37fr;
      gap: 32px;
      align-items: start;
      margin-top: 36px;
      margin-bottom: 52px;
    }

    .sr-video-stills-block {
      max-width: 820px;
    }

    .sr-video-stills-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
